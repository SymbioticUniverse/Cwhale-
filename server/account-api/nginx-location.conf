# Add inside the existing HTTPS server block for the deployment's public hostname.
# Keep the current static-site root and all existing location blocks.
location ^~ /v1/auth/ {
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
}

# Generation tasks are accepted quickly; model generation then runs in the
# durable worker and the phone polls the encrypted event log.
location ^~ /v1/generation/ {
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 16m;
}

