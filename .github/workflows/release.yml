name: Build and publish Cwhale releases

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: cwhale-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $versionLine) { throw 'pubspec.yaml has no version.' }
          $packageVersion = (($versionLine -replace '^version:\s*', '').Trim() -split '\+')[0]
          if ($packageVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match pubspec version $packageVersion."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build Windows installer and portable archive
        shell: pwsh
        run: .\tool\package_windows.ps1 -NoPub

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            release/Cwhale-Setup-*.exe
            release/Cwhale-*-portable.zip
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          assets=(release-assets/*)
          if [[ ${#assets[@]} -lt 2 ]]; then
            echo "Expected Windows installer and portable ZIP." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Cwhale $version" \
              --generate-notes
          fi
